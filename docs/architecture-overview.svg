<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" aria-labelledby="title desc" role="img" viewBox="0 0 1400 920"><title id="title">ai-memory architecture overview</title><desc id="desc">A diagram showing agent clients sending lifecycle hooks and MCP calls into ai-memory serve, which routes through hook, MCP, web, admin, scope, auth, writer, read pool, markdown wiki, SQLite index, scheduled auto-improvement and maintenance jobs, and optional LLM and embedding providers.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#15803d" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.canvas{fill:#f8fafc}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 15px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.group-label{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155;letter-spacing:.02em}.box-title{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-text{font:500 13px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.client{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:16}.server{fill:#eef2ff;stroke:#818cf8;stroke-width:2;rx:22}.route{fill:#fff;stroke:#a5b4fc;stroke-width:1.5;rx:14}.boundary{fill:#fef3c7;stroke:#f59e0b}.boundary,.job,.reader,.writer{stroke-width:1.5;rx:14}.writer{fill:#dcfce7;stroke:#22c55e}.reader{fill:#dbeafe;stroke:#3b82f6}.job{fill:#f5f3ff;stroke:#8b5cf6}.external,.store{stroke-width:1.5;rx:16}.store{fill:#fff;stroke:#64748b}.external{fill:#fff7ed;stroke:#fb923c}.arrow{stroke:#334155;marker-end:url(#arrow)}.arrow,.arrow-blue,.arrow-green{fill:none;stroke-width:2.2}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-green{stroke:#15803d;marker-end:url(#arrow-green)}.arrow-dashed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs><rect width="1400" height="920" x="0" y="0" class="canvas"/><text x="700" y="48" class="title" text-anchor="middle">ai-memory architecture overview</text><text x="700" y="76" class="subtitle" text-anchor="middle">Hooks capture automatically; markdown is the source of truth; SQLite is the derived search/index layer.</text><text x="70" y="112" class="group-label">CLIENTS</text><rect width="290" height="118" x="60" y="130" class="client"/><text x="85" y="164" class="box-title">Agent CLIs</text><text x="85" y="190" class="box-text">Claude Code, Codex, OpenCode</text><text x="85" y="211" class="box-text">Cursor, Gemini, Antigravity</text><text x="85" y="232" class="box-text">Grok, OpenClaw, OMP</text><rect width="290" height="118" x="390" y="130" class="client"/><text x="415" y="164" class="box-title">Terminal and automation</text><text x="415" y="190" class="box-text">ai-memory CLI thin clients</text><text x="415" y="211" class="box-text">bootstrap, search, backup</text><text x="415" y="232" class="box-text">lint, embed, forget-sweep</text><rect width="290" height="118" x="720" y="130" class="client"/><text x="745" y="164" class="box-title">Browser and API clients</text><text x="745" y="190" class="box-text">/web wiki browser</text><text x="745" y="211" class="box-text">/admin operator routes</text><text x="745" y="232" class="box-text">/api/v1 integration surface</text><rect width="290" height="118" x="1050" y="130" class="external"/><text x="1075" y="164" class="box-title">Optional providers</text><text x="1075" y="190" class="box-text">LLM consolidation and lint</text><text x="1075" y="211" class="box-text">scheduled review + approval</text><text x="1075" y="232" class="box-text">embedding vector backfill</text><rect width="1280" height="390" x="60" y="300" class="server"/><text x="90" y="335" class="group-label">ai-memory serve - one Rust binary</text><rect width="235" height="100" x="100" y="365" class="route"/><text x="125" y="397" class="box-title">/hook router</text><text x="125" y="423" class="box-text">fire-and-forget capture</text><text x="125" y="444" class="box-text">sanitizes hook payloads</text><rect width="235" height="100" x="375" y="365" class="route"/><text x="400" y="397" class="box-title">MCP server</text><text x="400" y="423" class="box-text">stdio and HTTP /mcp</text><text x="400" y="444" class="box-text">memory_query, handoff, etc.</text><rect width="235" height="100" x="650" y="365" class="route"/><text x="675" y="397" class="box-title">Web, admin, API</text><text x="675" y="423" class="box-text">wiki UI and operator routes</text><text x="675" y="444" class="box-text">HTTP API integrations</text><rect width="360" height="100" x="925" y="365" class="boundary"/><text x="950" y="397" class="box-title">Scope, auth, admission</text><text x="950" y="423" class="box-text">workspace/project resolution</text><text x="950" y="444" class="box-text">capability gates + webhooks</text><rect width="345" height="110" x="150" y="535" class="writer"/><text x="175" y="568" class="box-title">Writer actor</text><text x="175" y="594" class="box-text">single mpsc queue, one rusqlite writer</text><text x="175" y="615" class="box-text">WAL mode, batch transactions</text><rect width="345" height="110" x="555" y="535" class="reader"/><text x="580" y="568" class="box-title">Read pool and retrieval</text><text x="580" y="594" class="box-text">FTS5 + entity + graph RRF</text><text x="580" y="615" class="box-text">optional vector + authority + raw fallback</text><rect width="300" height="110" x="960" y="535" class="job"/><text x="985" y="568" class="box-title">Lifecycle and scheduled jobs</text><text x="985" y="594" class="box-text">session summary + handoff</text><text x="985" y="615" class="box-text">auto-improve scheduler</text><text x="985" y="636" class="box-text">consolidate, lint, embed, sweep</text><text x="70" y="735" class="group-label">DURABLE STATE</text><rect width="350" height="120" x="105" y="755" class="store"/><text x="130" y="789" class="box-title">Markdown wiki</text><text x="130" y="815" class="box-text">source of truth on disk</text><text x="130" y="836" class="box-text">git commits, restore-page</text><text x="130" y="857" class="box-text">editable by humans/tools</text><rect width="350" height="120" x="525" y="755" class="store"/><text x="550" y="789" class="box-title">SQLite memory.sqlite</text><text x="550" y="815" class="box-text">derived index and audit store</text><text x="550" y="836" class="box-text">pages, sessions, observations</text><text x="550" y="857" class="box-text">FTS5, handoffs, embeddings</text><rect width="350" height="120" x="945" y="755" class="store"/><text x="970" y="789" class="box-title">Backups and checkpoints</text><text x="970" y="815" class="box-text">SQLite online backup</text><text x="970" y="836" class="box-text">wiki git checkpoints</text><text x="970" y="857" class="box-text">rsync or tarball restore</text><path d="M 205 248 C 205 280 205 320 205 365" class="arrow-blue"/><text x="105" y="287" class="small">lifecycle hooks POST /hook</text><path d="M 260 248 C 320 290 410 320 492 365" class="arrow-blue"/><text x="370" y="308" class="small">MCP stdio or HTTP</text><path d="M 535 248 C 590 292 660 320 735 365" class="arrow-blue"/><text x="553" y="286" class="small">CLI HTTP calls</text><path d="M 865 248 C 865 295 800 320 768 365" class="arrow-blue"/><text x="805" y="287" class="small">browser/API HTTP</text><path d="M 335 415 L 375 415" class="arrow"/><path d="M 610 415 L 650 415" class="arrow"/><path d="M 885 415 L 925 415" class="arrow"/><text x="936" y="488" class="small">authorized write/read requests</text><path d="M 1040 465 C 910 515 610 500 495 560" class="arrow-green"/><path d="M 1110 465 C 1040 520 940 520 900 570" class="arrow-blue"/><path d="M 323 645 C 300 690 285 720 280 755" class="arrow-green"/><path d="M 405 645 C 500 700 615 710 700 755" class="arrow-green"/><path d="M 700 755 C 705 715 715 680 728 645" class="arrow-blue"/><path d="M 600 645 C 505 700 380 714 285 755" class="arrow-blue"/><path d="M 455 810 C 490 775 500 775 525 810" class="arrow-dashed"/><text x="458" y="747" class="small">watcher reconciliation</text><path d="M 1100 645 C 1090 700 1110 720 1120 755" class="arrow"/><path d="M 455 835 C 620 895 780 895 945 835" class="arrow"/><path d="M 875 835 C 900 835 920 835 945 835" class="arrow"/><path d="M 1195 535 C 1240 445 1240 330 1195 248" class="arrow-dashed"/><text x="1212" y="388" class="small">LLM and embedding calls</text><text x="70" y="900" class="small">Solid arrows show request, read, and write paths. Dashed arrows show background reconciliation or provider-backed maintenance.</text></svg>